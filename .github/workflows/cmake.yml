name: Editor Desktop

on:
  push:
    branches:
      - '*'
  release:
    types: [published]

# The SignPath action reads the job details and downloads the unsigned artifact
# through the GitHub API.
permissions:
  contents: read
  actions: read

env:
  BUILD_TYPE: Release
  TARGET: doriax-editor
  # Authenticode signing of the Windows binaries. The API token of the "CI builds"
  # SignPath CI user lives in the SIGNPATH_API_TOKEN repository secret.
  SIGNPATH_ORGANIZATION_ID: 71ade14e-ea98-448b-b32f-954d41e71ef9
  SIGNPATH_PROJECT_SLUG: doriax
  # Keep at 3.5.1 or newer: 3.4 segfaults inside glfwTerminate on Wayland when
  # the last frame swapped without a following poll (glfw/glfw#2744).
  GLFW_VERSION: 3.5.1
  SDL2_VERSION: 2.30.11

jobs:
  build:
    name: Build for ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      # Only the Windows binaries are signed, and only when the secret is
      # readable: forks and pull requests from forks produce an unsigned build
      # instead of a failing job.
      SIGN_WINDOWS: ${{ startsWith(matrix.config.os, 'windows') && secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        config: 
        - {
            name: "Windows Latest MSVC",
            os: windows-latest,
            artifact: "doriax_windows",
            cc: "cl",
            cxx: "cl",
            generators: "Visual Studio 18 2026"
          }
        - {
            name: "Windows Latest MinGW",
            os: windows-latest,
            artifact: "doriax_windows_mingw",
            cc: "gcc",
            cxx: "g++",
            generators: "Ninja"
          }
        - {
            name: "Ubuntu Latest GCC",
            os: ubuntu-latest,
            artifact: "doriax_linux",
            cc: "gcc",
            cxx: "g++",
            generators: "Ninja"
          }
        - {
            name: "macOS Latest Clang",
            os: macos-latest,
            artifact: "doriax_macos",
            cc: "clang",
            cxx: "clang++",
            generators: "Ninja"
          }

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          # Full history so git describe can resolve v0.6-N-gHASH like local builds.
          fetch-depth: 0

      - name: Print env
        run: |
          echo github.event.action: ${{ github.event.action }}
          echo github.event_name: ${{ github.event_name }}

      - name: Install dependencies on Windows
        if: startsWith(matrix.config.os, 'windows')
        run: |
          choco install ninja cmake
          ninja --version
          cmake --version

      - name: Install Vulkan SDK on Windows
        if: startsWith(matrix.config.os, 'windows')
        uses: jakoch/install-vulkan-sdk-action@v1.0.0
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true

      - name: Install dependencies on Ubuntu
        if: startsWith(matrix.config.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build cmake libx11-dev libxrandr-dev libvulkan-dev libwayland-dev wayland-protocols extra-cmake-modules libgtk-3-dev libdbus-1-dev libcurl4-openssl-dev
          ninja --version
          cmake --version
          gcc --version

      - name: Install dependencies on macOS
        if: startsWith(matrix.config.os, 'macos')
        run: |
          # cmake is already installed
          brew install ninja
          ninja --version
          cmake --version

      - name: Set version
        shell: bash
        run: |
          # Same command as CMakeLists.txt. fetch-depth: 0 + tags so describe
          # can resolve v0.6-N-gHASH the same way as a local clone.
          git fetch --tags --quiet || true
          VERSION="$(git describe --tags --always --dirty)"
          echo "DORIAX_VERSION=$VERSION" >> $GITHUB_ENV
          
      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
        run: |
          mkdir build
          mkdir instdir
          cmake \
            -S . \
            -B build \
            -DDORIAXEDITOR_VERSION:STRING="$DORIAX_VERSION" \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -G "${{ matrix.config.generators }}" \
            -DCMAKE_INSTALL_PREFIX:PATH=instdir \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        shell: bash
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
        run: |
          targets=("${{ env.TARGET }}")
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            targets+=("${{ env.TARGET }}-cmd")
          fi
          cmake --build build --config ${{env.BUILD_TYPE}} --target "${targets[@]}"

      - name: Install Strip
        shell: bash
        run: cmake --install build --config ${{env.BUILD_TYPE}} --strip
        
      - name: List directories
        shell: bash
        working-directory: instdir
        run: ls -laR

      # Windows Defender flags unsigned Doriax builds as Sabsik!ml at random, so
      # the binaries are Authenticode-signed before they are published. Only the
      # PE files make the round trip; the rest of instdir/bin never leaves here.
      - name: Collect Windows binaries for signing
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          mkdir to-sign
          find instdir/bin -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dll' \) -exec cp {} to-sign/ \;
          ls -la to-sign

      - name: Upload unsigned binaries
        id: upload-unsigned
        if: env.SIGN_WINDOWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}_unsigned
          path: ./to-sign/*
          if-no-files-found: error
          retention-days: 1

      - name: Sign binaries with SignPath
        if: env.SIGN_WINDOWS == 'true'
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          # main is what doriax.org serves through nightly.link, so it needs a
          # real signature just like a published release. Other branches get a
          # test signature, which Windows does not trust and which must not be
          # published.
          signing-policy-slug: ${{ (github.event_name == 'release' || github.ref == 'refs/heads/main') && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          # The SignPath Foundation release certificate requires a human to
          # approve each request, so the job has to outlast that click. The
          # action's own default is 10 minutes, which is not enough in practice.
          wait-for-completion-timeout-in-seconds: 1800

      - name: Put signed binaries back
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          cp signed/* instdir/bin/
          ls -la instdir/bin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}
          path: ./instdir/bin/*
          if-no-files-found: error
